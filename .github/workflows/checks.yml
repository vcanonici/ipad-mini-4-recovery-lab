name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: cc -Wall -Wextra -Werror -fsyntax-only tools/read_boot_context.c
